name: CI

on:
  push:
    branches: [ main, next ]
  pull_request:
    branches: [ main, next ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.25' ]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install Redis server
        run: sudo apt-get update && sudo apt-get install redis-server

      - name: Display Go version
        run: go version

      - name: Build
        run: go build ./...

      - name: Run tests with coverage
        run:  go test -coverpkg=./internal/...,./pkg/... -coverprofile=coverage.out -count=1 ./internal/... ./pkg/... ./tests/...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Run benchmarks (optional)
        if: github.event_name == 'push' && github.ref == 'refs/heads/next'
        run: go test -bench=. -benchmem -run=^$ ./benchmark/... -timeout 30m

  pkg-go-dev-refresh:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: success() && github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        env:
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            VERSION="${REF#refs/tags/}"
          else
            SHORT_SHA=$(echo "${COMMIT_SHA}" | cut -c1-12)
            TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
            VERSION="v0.0.0-${TIMESTAMP}-${SHORT_SHA}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Trigger pkg.go.dev refresh
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          echo "Requesting pkg.go.dev to index version ${VERSION}"
          curl -fsSL "https://proxy.golang.org/github.com/weyoss/go-redis-smq/@v/${VERSION}.info"