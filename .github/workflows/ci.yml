name: CI

on:
  push:
    branches: [ main, next ]
  pull_request:
    branches: [ main, next ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.25' ]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install Redis server
        run: sudo apt-get update && sudo apt-get install redis-server

      - name: Display Go version
        run: go version

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test -v -timeout 15m ./...

      - name: Run benchmarks (optional)
        if: github.event_name == 'push' && github.ref == 'refs/heads/next'
        run: go test -bench=. -benchmem -run=^$ ./benchmark/... -timeout 30m