linters:
  enable:
    # currently enabled
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

    # formatting & imports
    - gofmt
    - goimports

    # style and best practices
    - revive           # drop-in replacement for golint, configurable
    - misspell         # common typos
    - errorlint        # error wrapping / comparison issues
    - gocritic         # many style and performance checks
    - prealloc         # slice preallocation suggestions
    - unconvert        # unnecessary type conversions
    - whitespace       # unnecessary blank lines

issues:
  exclude-rules:
    - path: internal/testutil/
      linters:
        - revive
      text: "context-as-argument" # In test helpers, it’s common to have testing.TB first
  exclude:
    - "SA1019" # ZRangeByScore/BRPopLPush/RPopLPush is deprecated
  exclude-dirs:
    - tests
    - benchmark


